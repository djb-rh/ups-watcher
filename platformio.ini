; UPS Watcher — a NUT (Network UPS Tools) server for the M5Stack Core Basic +
; USB Module (MAX3421E), reading APC UPSes over USB HID Power Device class.
; Toolchain as in FlapBoard / HomePad: pioarduino 55.03.312-1 = Arduino core
; 3.3.12 / ESP-IDF 5.5.5. Needs PlatformIO Core >= 6.2.

[platformio]
default_envs = app

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-core-esp32-16M
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    m5stack/M5Unified@^0.2.27
    https://github.com/m5stack/M5-Max3421E-USBShield.git
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DUPSW_VERSION=\"0.1.3\"
    -DCORE_DEBUG_LEVEL=1
    -I${PROJECT_DIR}/include

; Hardware probe: dumps the UPS's HID report descriptor and polls every report.
[env:probe]
extends = common
build_src_filter = +<probe/> +<common/>
build_flags =
    ${common.build_flags}
    -DCFG_TUSB_DEBUG=1

; The NUT server itself.
[env:app]
extends = common
build_src_filter = +<app/> +<common/>

; Host-side unit tests for the plain C++ modules: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -I${PROJECT_DIR}/include -DUNITY_INCLUDE_DOUBLE
test_build_src = yes
build_src_filter = +<common/>
